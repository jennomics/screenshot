# XcodeGen project spec — declarative source of truth for the .xcodeproj.
# Generate with:  xcodegen generate   (brew install xcodegen)
#
# Structure:
#   Screenshot       — the SwiftUI app
#   ShareExtension   — the capture-modal Share Extension (embedded in the app)
#   ScreenshotKit    — the shared on-device data layer + design system (SwiftPM),
#                      linked into BOTH targets so they share one schema + store.
name: Screenshot
options:
  bundleIdPrefix: com.jennomics
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Explicit configurations so compiler flags are unambiguous per build type.
configs:
  Debug: debug
  Release: release

packages:
  ScreenshotKit:
    path: ScreenshotKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Keep app + extension versions in sync (they must match, or the build warns).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Team + App Group. The group id must match the entitlements files in App/
    # and ShareExtension/.
    DEVELOPMENT_TEAM: 376BFM76K7
    CODE_SIGN_STYLE: Automatic
  configs:
    # DEBUG is defined ONLY in Debug. The sample-data seed is wrapped in
    # `#if DEBUG`, so this guarantees it can never ship in a Release build /
    # archive, regardless of how the app is built.
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Screenshot:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/SeedImages/**"
      # Bundle the seed screenshots explicitly as resources so they ship in the
      # app and can be loaded at runtime via Bundle.main.
      - path: App/Resources/SeedImages
        buildPhase: resources
    dependencies:
      - package: ScreenshotKit
      - target: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jennomics.screenshot
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Screenshot.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    dependencies:
      - package: ScreenshotKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jennomics.screenshot.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO

  # UI-test target driven by the marketing-video pipeline (video/). Records the
  # five R6 demo flows from the simulator. Sole app-side addition the pipeline
  # requires (requirement N5).
  ScreenshotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Screenshot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jennomics.screenshot.uitests
        GENERATE_INFOPLIST_FILE: YES

# Explicit SHARED scheme so the Run destination selector always appears in
# Xcode's toolbar (auto-generated schemes are per-user and sometimes don't
# materialize on first open of a freshly generated project).
schemes:
  Screenshot:
    build:
      targets:
        Screenshot: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScreenshotUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
